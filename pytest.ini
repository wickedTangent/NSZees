[pytest]
testpaths = tests
pythonpath = src

# Run with bin/python.exe, not a system Python: several tests import
# nszees.services, which imports the nsz package (and its compiled
# zstandard/pycryptodome deps) bundled in bin/Lib/site-packages, and
# those wheels are built for this project's exact bundled Python version.
#   bin/python.exe -m pytest
#
# pytest itself isn't installed in bin/ (kept out of the redistributable).
# It lives in the gitignored .dev-test-deps/ folder instead, and
# bin/Lib/site-packages/_dev_test_deps.pth (also gitignored, local to
# bin/) points bin/python.exe's import system at it - no copying needed.
# To set this up fresh (e.g. a new clone/machine):
#   pip install --target=.dev-test-deps pytest
#   echo <absolute path to .dev-test-deps> > bin/Lib/site-packages/_dev_test_deps.pth
